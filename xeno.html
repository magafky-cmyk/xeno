<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Xeno IP</title>

    <meta name="description" content="Информация о владельце домена и его назначении в сфере CR:MP.">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Arial, sans-serif;
            background: #000;
            color: #f5f5f7;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 52px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.72);
            -webkit-backdrop-filter: blur(20px);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .nav-inner {
            width: min(980px, 100% - 40px);
            height: 100%;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: -0.2px;
        }

        .nav-link {
            color: #a1a1a6;
            text-decoration: none;
            font-size: 13px;
            transition: color 0.25s;
        }

        .nav-link:hover {
            color: #fff;
        }

        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 120px 20px 100px;
            position: relative;
        }

        .hero::before {
            content: "";
            position: absolute;
            width: 800px;
            height: 500px;
            top: 5%;
            left: 50%;
            transform: translateX(-50%);
            background: radial-gradient(rgba(80, 110, 255, 0.16), transparent 65%);
            filter: blur(40px);
            pointer-events: none;
        }

        .hero-content {
            position: relative;
            max-width: 1000px;
            animation: heroAppear 1s ease both;
        }

        @keyframes heroAppear {

            0% {
                opacity: 0;
                transform: translateY(30px);
            }

            100% {
                opacity: 1;
                transform: translateY(0);
            }

        }

        .eyebrow {
            color: #86868b;
            font-size: 17px;
            font-weight: 500;
            margin-bottom: 22px;
        }

        h1 {
            font-size: clamp(56px, 10vw, 108px);
            line-height: 0.95;
            letter-spacing: -5px;
            font-weight: 700;
            margin-bottom: 28px;
        }

        h1 span {
            background: linear-gradient(90deg, #fff, #9b9ba0);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .subtitle {
            max-width: 680px;
            margin: auto;
            color: #86868b;
            font-size: clamp(19px, 2.5vw, 26px);
            line-height: 1.45;
            letter-spacing: -0.5px;
        }

        section {
            padding: 160px 20px;
        }

        .section-container {
            width: min(980px, 100%);
            margin: auto;
        }

        .section-small {
            color: #86868b;
            font-size: 17px;
            font-weight: 500;
            margin-bottom: 18px;
        }

        .section-title {
            font-size: clamp(42px, 7vw, 76px);
            line-height: 1.02;
            letter-spacing: -3.5px;
            font-weight: 700;
            max-width: 850px;
            margin-bottom: 30px;
        }

        .section-text {
            max-width: 720px;
            color: #86868b;
            font-size: clamp(19px, 2.3vw, 24px);
            line-height: 1.55;
            letter-spacing: -0.3px;
        }

        .owner-section {
            background: #f5f5f7;
            color: #1d1d1f;
        }

        .owner-section .section-small {
            color: #6e6e73;
        }

        .owner-section .section-text {
            color: #6e6e73;
        }

        .owner-name {
            margin-top: 45px;
            font-size: clamp(28px, 5vw, 52px);
            font-weight: 600;
            letter-spacing: -2px;
            color: #1d1d1f;
        }

        .owner-label {
            margin-top: 8px;
            color: #6e6e73;
            font-size: 16px;
        }

        .purpose {
            min-height: 90vh;
            display: flex;
            align-items: center;
            background: #000;
        }

        .purpose-highlight {
            color: #fff;
        }

        .purpose-highlight span {
            color: #86868b;
        }

        .build {
            margin-top: 50px;
            font-size: clamp(45px, 8vw, 90px);
            font-weight: 700;
            letter-spacing: -4px;
            background: linear-gradient(90deg, #fff, #707070);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .info {
            background: #f5f5f7;
            color: #1d1d1f;
        }

        .info .section-small {
            color: #6e6e73;
        }

        .info .section-title {
            color: #1d1d1f;
        }

        .info .section-text {
            color: #6e6e73;
        }

        .crmp {
            margin-top: 45px;
            font-size: 20px;
            line-height: 1.6;
            color: #1d1d1f;
            max-width: 720px;
        }

        footer {
            padding: 35px 20px;
            background: #f5f5f7;
            border-top: 1px solid #d2d2d7;
            color: #6e6e73;
            font-size: 12px;
        }

        .footer-inner {
            width: min(980px, 100%);
            margin: auto;
            display: flex;
            justify-content: space-between;
            gap: 20px;
        }

        @media (max-width: 600px) {

            .nav-inner {
                width: calc(100% - 28px);
            }

            h1 {
                letter-spacing: -3px;
            }

            section {
                padding: 110px 22px;
            }

            .section-title {
                letter-spacing: -2px;
            }

            .footer-inner {
                flex-direction: column;
            }

        }

        .reveal {
            opacity: 0;
            transform: translateY(35px);
            transition: opacity 0.9s, transform 0.9s;
        }

        .reveal.visible {
            opacity: 1;
            transform: translateY(0);
        }

    </style>

</head>

<body>

    <nav>

        <div class="nav-inner">

            <div class="logo">
                Xeno IP
            </div>

            <a class="nav-link" href="#about">
                О владельце
            </a>

        </div>

    </nav>

    <section class="hero">

        <div class="hero-content">

            <div class="eyebrow">
                CR:MP
            </div>

            <h1>
                <span>Xeno IP</span>
            </h1>

            <p class="subtitle">
                Домен, используемый в сфере CR:MP
                для замены IP-адреса
                в build 16.21.
            </p>

        </div>

    </section>

    <section id="about" class="owner-section">

        <div class="section-container reveal">

            <div class="section-small">
                Владелец домена
            </div>

            <h2 class="section-title">
                Этот домен принадлежит
                разработчику проекта.
            </h2>

            <div class="owner-name">
                Xeno-Ru / telegram: @xxahalok
            </div>

            <div class="owner-label">
                Владелец домена Xeno IP
            </div>

        </div>

    </section>

    <footer>

        <div class="footer-inner">

            <div>
                Xeno IP
            </div>

            <div>
                CR:MP · Build 16.21
            </div>

            <div>
                © 2026
            </div>

        </div>

    </footer>

    <script>

        const revealEls = document.querySelectorAll('.reveal');

        if ('IntersectionObserver' in window) {

            const io = new IntersectionObserver((entries) => {

                entries.forEach((entry) => {

                    if (entry.isIntersecting) {

                        entry.target.classList.add('visible');

                        io.unobserve(entry.target);

                    }

                });

            }, { threshold: 0.15 });

            revealEls.forEach((el) => io.observe(el));

        } else {

            revealEls.forEach((el) => el.classList.add('visible'));

        }

    </script>

</body>

</html>
